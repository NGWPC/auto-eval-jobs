name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: '3.12'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      image_base: ${{ steps.vars.outputs.image_base }}
      image_base_gval: ${{ steps.vars.outputs.image_base_gval }}
      pr_tag: ${{ steps.vars.outputs.pr_tag }}
      commit_sha: ${{ steps.vars.outputs.commit_sha }}
      commit_sha_short: ${{ steps.vars.outputs.commit_sha_short }}
      test_image_tag: ${{ steps.vars.outputs.test_image_tag }}
    steps:
      - name: Compute image vars
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          ORG="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          REPO="auto-eval-jobs"
          REPO_GVAL="auto-eval-jobs-gval"
          IMAGE_BASE="${REGISTRY}/${ORG}/${REPO}"
          IMAGE_BASE_GVAL="${REGISTRY}/${ORG}/${REPO_GVAL}"
          echo "image_base=${IMAGE_BASE}" >> "$GITHUB_OUTPUT"
          echo "image_base_gval=${IMAGE_BASE_GVAL}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
            PR_TAG="pr-${PR_NUM}-build"
            echo "pr_tag=${PR_TAG}" >> "$GITHUB_OUTPUT"
            echo "test_image_tag=${PR_TAG}" >> "$GITHUB_OUTPUT"
          fi
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            COMMIT_SHA="${GITHUB_SHA}"
            SHORT_SHA="${COMMIT_SHA:0:12}"
            echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
            echo "commit_sha_short=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "test_image_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push auto-eval-jobs image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          labels: |
            org.opencontainers.image.title=AutoEval Jobs
            org.opencontainers.image.description=Automated evaluation jobs application
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.authors=${{ github.actor }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=NGWPC
            maintainer=${{ github.actor }}
          tags: |
            ${{ needs.setup.outputs.image_base }}:${{ needs.setup.outputs.test_image_tag }}
            ${{ needs.setup.outputs.image_base }}:latest

      - name: Build & push auto-eval-jobs-gval image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.gval
          push: true
          labels: |
            org.opencontainers.image.title=AutoEval Jobs GVAL
            org.opencontainers.image.description=Automated evaluation jobs GVAL application
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.authors=${{ github.actor }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=NGWPC
            maintainer=${{ github.actor }}
          tags: |
            ${{ needs.setup.outputs.image_base_gval }}:${{ needs.setup.outputs.test_image_tag }}
            ${{ needs.setup.outputs.image_base_gval }}:${{ needs.setup.outputs.latest_tag }}

  sonarqube-internal:
    if: (github.event_name == 'pull_request' || github.event_name == 'push') && github.repository_owner == 'NGWPC'
    runs-on: self-hosted
    needs: [setup, build]
    continue-on-error: true
    container:
      image: sonarsource/sonar-scanner-cli
      options: --entrypoint="" --user 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: sonar-scanner -X -Dsonar.verbose=true

  container-scanning:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [setup, build]
    steps:
      - name: Scan auto-eval-jobs image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.setup.outputs.image_base }}:${{ needs.setup.outputs.test_image_tag }}
          format: 'template'
          template: '@/contrib/sarif.tpl'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Upload auto-eval-jobs scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-auto-eval-jobs'

      - name: Scan auto-eval-jobs-gval image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.setup.outputs.image_base_gval }}:${{ needs.setup.outputs.test_image_tag }}
          format: 'template'
          template: '@/contrib/sarif.tpl'
          output: 'trivy-results-gval.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Upload auto-eval-jobs-gval scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results-gval.sarif'
          category: 'trivy-auto-eval-jobs-gval'
